# Android Auto Desktop Head Unit (DHU) configuration
# Reference profile: Opel Corsa Electric (1280x720, 160 dpi, 60 fps)
#
# Launch example (after `adb forward tcp:5277 tcp:5277`):
#   ~/Library/Android/sdk/extras/google/auto/desktop-head-unit -c tools/headunit_corsa.ini

[general]
resolution = 1280x720
dpi = 160
framerate = 60
touch = true
touchpad = false
